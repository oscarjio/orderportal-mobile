name: Bygg Android-apk

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - run: npm ci

      - name: Synka webbappen till Android-projektet
        run: npx cap sync android

      - name: Bygg apk
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Döp om apk
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "OrderPortal-$VERSION.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OrderPortal-android
          path: OrderPortal-*.apk
          if-no-files-found: error

      - name: Publicera release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OrderPortal-*.apk
          generate_release_notes: true
